name: Build APK (flutter_app)

# Versión para cuando subes el PROYECTO COMPLETO a GitHub (flutter_app/ es
# una subcarpeta). Si en cambio hiciste de flutter_app/ la raíz del repo,
# se usa .github/workflows/build-apk.yml y esta no se ejecuta.

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter-apk.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (keeps existing lib/ and manifest)
        run: flutter create . --platforms android --project-name pokeclima

      - name: Pub get
        run: flutter pub get

      - name: Analyze (informativo, no bloquea el APK)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeclima-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
